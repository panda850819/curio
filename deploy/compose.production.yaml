services:
  curio:
    image: ${CURIO_IMAGE:-curio/server:unconfigured}
    labels:
      com.panda.personal-infra.service: curio
      com.panda.personal-infra.healthz: http://curio:3000/healthz
      com.panda.personal-infra.readyz: http://curio:3000/readyz
      com.panda.personal-infra.version: http://curio:3000/version
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'health_contract=$${CURIO_HEALTH_CONTRACT:-health-v1}; release_revision=$${CURIO_RELEASE_REVISION:-unknown}; build_time=$${CURIO_BUILD_TIME:-unknown}; set -a; . /run/secrets/curio_env; set +a; export CURIO_HEALTH_CONTRACT="$$health_contract" CURIO_RELEASE_REVISION="$$release_revision" CURIO_BUILD_TIME="$$build_time"; exec bun run src/index.ts'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/curio.db
      CURIO_HEALTH_CONTRACT: ${CURIO_HEALTH_CONTRACT:-health-v1}
    secrets:
      - curio_env
    volumes:
      - ./data:/data
    expose:
      - "3000"
    networks:
      private:
        aliases:
          - curio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const path=process.env.CURIO_HEALTH_CONTRACT==='legacy-v0'?'/health':'/healthz';const r=await fetch(`http://127.0.0.1:3000$${path}`);if(!r.ok)process.exit(1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

secrets:
  curio_env:
    file: ./runtime/curio.env

networks:
  private:
    external: true
    name: personal-infra_private
