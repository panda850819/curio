services:
  curio:
    image: ${CURIO_IMAGE:-curio/server:5bf99fe}
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "set -a; . /run/secrets/curio_env; set +a; exec bun run src/index.ts"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/curio.db
    secrets:
      - curio_env
    volumes:
      - ./data:/data
    expose:
      - "3000"
    networks:
      private:
        aliases:
          - curio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

secrets:
  curio_env:
    file: ./runtime/curio.env

networks:
  private:
    external: true
    name: personal-infra_private
