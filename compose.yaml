services:
  curio:
    build:
      context: .
    image: curio/server:local
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/curio.db
    volumes:
      - ./data:/data
    expose:
      - "3000"
    networks:
      private:
        aliases:
          - curio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  private:
    external: true
    name: ${CURIO_NETWORK:-personal-infra_private}
